name: Atualizacao FinLogic Data

on:
  workflow_dispatch:
  schedule:
    - cron: "00 06 * * *"

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync

      - name: Download data from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_staging
          if gh release view latest >/dev/null 2>&1; then
            gh release download latest \
              --pattern "financials.parquet" \
              --pattern "trades.parquet" \
              --pattern "language.parquet" \
              --pattern "traded_companies.json" \
              --dir release_staging
          else
            echo "No latest release found yet; starting from empty release_staging."
          fi

      - name: Download silver cache from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p cache/silver/cvm/processed
          if gh release view silver >/dev/null 2>&1; then
            gh release download silver \
              --pattern "dfp_cia_aberta_*.parquet" \
              --pattern "itr_cia_aberta_*.parquet" \
              --dir cache/silver/cvm/processed
          else
            echo "No silver release found yet; starting from empty silver cache."
          fi

      - name: Run update script
        run: uv run python update.py

      - name: Publish gold release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release_staging/financials.parquet \
              release_staging/trades.parquet \
              release_staging/language.parquet \
              release_staging/traded_companies.json \
              --clobber
          else
            gh release create "$TAG" \
              release_staging/financials.parquet \
              release_staging/trades.parquet \
              release_staging/language.parquet \
              release_staging/traded_companies.json \
              --title "Latest data" \
              --notes "Updated dataset." \
              --latest
          fi

      - name: Publish silver release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="silver"
          files=(cache/silver/cvm/processed/*.parquet)
          if [ ! -e "${files[0]}" ]; then
            echo "No silver parquet files found to publish."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cache/silver/cvm/processed/*.parquet --clobber
          else
            gh release create "$TAG" \
              cache/silver/cvm/processed/*.parquet \
              --title "Silver cache" \
              --notes "Incremental CVM parquet cache for the pipeline."
          fi
